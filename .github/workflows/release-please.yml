name: Release Please

on:
  workflow_call:
    inputs:
      config-file:
        description: Path to the release-please configuration file.
        type: string
        required: false
        default: release-please-config.json
      manifest-file:
        description: Path to the release-please manifest file.
        type: string
        required: false
        default: .release-please-manifest.json
      target-branch:
        description: Branch release-please should track. Defaults to the branch the workflow runs on.
        type: string
        required: false
        default: ${{ github.ref_name }}
      skip-github-release:
        description: If true, only open the release pull request and skip cutting the GitHub Release.
        type: boolean
        required: false
        default: false
      skip-github-pull-request:
        description: If true, cut releases for already-merged release PRs and skip opening new release pull requests.
        type: boolean
        required: false
        default: false
      skip-labeling:
        description: If true, do not apply labels to release pull requests.
        type: boolean
        required: false
        default: false
      include-component-in-tag:
        description: If true, prefix tags and branches with the component name (monorepo style).
        type: boolean
        required: false
        default: false
      path:
        description: Run release-please against a subdirectory of the repository rather than the root.
        type: string
        required: false
        default: ""
      runs-on:
        description: Runner label for the release job.
        type: string
        required: false
        default: ubuntu-latest
    secrets:
      client-id:
        description: GitHub App Client ID for Release Baton (visible on the app's settings page).
        required: true
      app-private-key:
        description: PEM-encoded private key for the Release Baton GitHub App.
        required: true
    outputs:
      release_created:
        description: Whether release-please cut a release in this run.
        value: ${{ jobs.release-please.outputs.release_created }}
      releases_created:
        description: JSON map of paths to release_created flags (manifest mode).
        value: ${{ jobs.release-please.outputs.releases_created }}
      paths_released:
        description: JSON array of paths that were released in this run.
        value: ${{ jobs.release-please.outputs.paths_released }}
      tag_name:
        description: Tag name release-please cut, when a release was created.
        value: ${{ jobs.release-please.outputs.tag_name }}
      pr:
        description: JSON describing the release pull request, when one was opened or updated.
        value: ${{ jobs.release-please.outputs.pr }}

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ${{ inputs.runs-on }}
    permissions: {}
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      releases_created: ${{ steps.release-please.outputs.releases_created }}
      paths_released: ${{ steps.release-please.outputs.paths_released }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
      pr: ${{ steps.release-please.outputs.pr }}
    steps:
      - name: Mint installation token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Run release-please
        id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          target-branch: ${{ inputs.target-branch }}
          skip-github-release: ${{ inputs.skip-github-release }}
          skip-github-pull-request: ${{ inputs.skip-github-pull-request }}
          skip-labeling: ${{ inputs.skip-labeling }}
          include-component-in-tag: ${{ inputs.include-component-in-tag }}
          path: ${{ inputs.path }}
