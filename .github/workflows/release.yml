name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    uses: ./.github/workflows/release-please.yml
    secrets:
      client-id: ${{ secrets.RELEASE_BATON_CLIENT_ID }}
      app-private-key: ${{ secrets.RELEASE_BATON_PRIVATE_KEY }}
